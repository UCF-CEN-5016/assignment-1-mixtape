name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only reads the checkout and runs lint and tests. It never writes
# to the repository, so it needs no write scope. Spelling that out matters here:
# this repo is a template, so every student repository generated from it
# inherits this workflow, and an unset permissions block would leave each of
# them running CI with the default token scope.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and UI tests
        run: npm test
